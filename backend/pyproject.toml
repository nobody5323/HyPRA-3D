[project]
name = "hypra-backend"
version = "0.1.0"
description = "HyPRA 后端：分层提示词 + 混合记忆（热/温/冷）+ 情绪识别 + 数字人驱动"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "openai>=1.54",
    "langgraph>=1.0",
    "mcp>=1.28,<2",
    # 中文分词（BM25 稀疏检索通道）；缺失时代码自动降级为字符 bigram
    "jieba>=0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# 数据文件（预设/世界书/模型档）随包一起安装，
# 否则容器内 pip install . 后仅 .py 会被装上，YAML 会丢失
[tool.setuptools.package-data]
"*" = ["*.yaml", "presets/*.yaml", "entries/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
