[project]
name = "hypra-backend"
version = "0.1.1"
description = "HyPRA 后端：分层提示词 + 混合记忆（热/温/冷）+ 情绪识别 + 数字人驱动"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # 与服务端版本对齐（docker-compose.yml 的 qdrant/qdrant 镜像）：
    # 官方要求 client 与 server 的 minor 差 ≤ 1，否则部分调用会报 500
    "qdrant-client>=1.19,<1.20",
    "openai>=1.54",
    "langgraph>=1.0",
    "mcp>=1.28,<2",
    # 中文分词（BM25 稀疏检索通道）；缺失时代码自动降级为字符 bigram
    "jieba>=0.42.1",
    # 个人记忆：上传文档的格式解析
    "pypdf>=5.1",          # PDF 文字提取（扫描件无文字层会明确报错）
    "python-docx>=1.1",    # .docx 解析（不支持老 .doc）
    "python-multipart>=0.0.20",  # FastAPI UploadFile 必需，缺失时上传路由直接 500
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# 感知层：本地语音识别（见 docs/proactive-multimodal.md §4.3）。
# **刻意不放进主依赖**：它拖进 ctranslate2 / onnxruntime / av 三个原生扩展
# （实测约 70 MB wheel），而「要不要语音输入」由 ASR_PROVIDER 决定——
# 不装它，整个对话链路与其余感知能力照常工作。
#
# ⚠️ 清华镜像**没有** faster-whisper，装它必须带上官方源：
#     pip install -i https://pypi.tuna.tsinghua.edu.cn/simple \
#                 --extra-index-url https://pypi.org/simple ".[asr]"
asr = [
    "faster-whisper>=1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# 数据文件（预设/世界书/模型档）随包一起安装，
# 否则容器内 pip install . 后仅 .py 会被装上，YAML 会丢失
[tool.setuptools.package-data]
"*" = ["*.yaml", "presets/*.yaml", "entries/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
