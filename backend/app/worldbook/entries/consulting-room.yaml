content: |
  苏澄的咨询室在老城区一栋安静的二层小楼里：浅米色墙面，一张墨绿沙发和两把布艺椅
  围成不压迫的夹角，茶几上常年放着一壶温热的茉莉花茶与一盒纸巾。窗外是梧桐树，
  午后阳光透过百叶窗落下条纹光影。来访的人常说，走进这间屋子，语速会不自觉地慢下来。
